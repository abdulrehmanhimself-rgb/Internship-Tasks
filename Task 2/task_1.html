<html>

<body>
<style>
* {
    margin-top: 10px;
    margin-left: 10px;
}
</style>
    <h1>Form</h1>
    <form>
        <label>Name: </label>
        <input type="text" name="name" id="name">
        <br>
    </form>
    <button onclick="submit()">Submit</button>
<script>
    function submit() {
        let name = document.getElementById("name").value;
        if(name=="")
        {
            alert("Error: Name is required");
        }
        else
        {
            alert("Submitted! Your Name: " + name);
        }
    }
</script>
</body>
</html>
