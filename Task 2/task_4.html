<html>
<body>
<style>
* {
    margin-top: 10px;
    margin-left: 10px;
}
</style>
    <h1>Form</h1>
    <form>
        <label>Enter Password: </label>
        <input type="password" password="password" id="pass1">
        <br>
        <label>Confirm Password: </label>
        <input type="password" password="password" id="pass2">
        <br>
    </form>
    <button onclick="submit()">Submit</button>
<script>
    function submit() {
        let pass1 = document.getElementById("pass1").value;
        let pass2 = document.getElementById("pass2").value;
        if(pass1 != pass2)
        {
            alert("Passwords do not match");
        }
        else
        {
            alert("Submitted! Your password is secure.");
        }
    }
</script>
</body>
</html>
